<svg viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="ai_bg" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#030610"/>
    </radialGradient>
    <radialGradient id="ai_core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1d4ed8" stop-opacity="0.45"/>
      <stop offset="50%" stop-color="#0891b2" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0"/>
    </radialGradient>
    <filter id="ai_glow">
      <feGaussianBlur stdDeviation="5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="ai_soft">
      <feGaussianBlur stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#ai_bg)"/>

  <!-- Core glow -->
  <ellipse cx="800" cy="420" rx="500" ry="400" fill="url(#ai_core)"/>

  <!-- Outer rings (AI brain/network visualization) -->
  <circle cx="800" cy="420" r="320" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="1" stroke-dasharray="6 6"/>
  <circle cx="800" cy="420" r="250" fill="none" stroke="rgba(59,130,246,0.1)" stroke-width="1" stroke-dasharray="4 4"/>
  <circle cx="800" cy="420" r="180" fill="none" stroke="rgba(8,145,178,0.15)" stroke-width="1.5" stroke-dasharray="3 5"/>
  <circle cx="800" cy="420" r="110" fill="none" stroke="rgba(59,130,246,0.2)" stroke-width="1.5"/>
  <circle cx="800" cy="420" r="60" fill="rgba(29,78,216,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="2"/>

  <!-- Center AI icon -->
  <circle cx="800" cy="420" r="38" fill="rgba(29,78,216,0.3)" stroke="rgba(96,165,250,0.5)" stroke-width="1.5" filter="url(#ai_glow)"/>
  <!-- Neural network icon in center -->
  <circle cx="800" cy="408" r="4" fill="#93c5fd"/><circle cx="792" cy="420" r="4" fill="#93c5fd"/><circle cx="808" cy="420" r="4" fill="#67e8f9"/>
  <circle cx="800" cy="432" r="4" fill="#93c5fd"/>
  <line x1="800" y1="408" x2="792" y2="420" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="800" y1="408" x2="808" y2="420" stroke="#67e8f9" stroke-width="1.2"/>
  <line x1="792" y1="420" x2="800" y2="432" stroke="#60a5fa" stroke-width="1.2"/>
  <line x1="808" y1="420" x2="800" y2="432" stroke="#67e8f9" stroke-width="1.2"/>
  <text x="800" y="456" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="rgba(148,163,184,0.6)" text-anchor="middle">AI Core</text>

  <!-- Orbiting nodes at 110r -->
  <g filter="url(#ai_soft)">
    <!-- Top -->
    <circle cx="800" cy="310" r="8" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="800" cy="310" r="3" fill="white"/>
    <!-- Right -->
    <circle cx="910" cy="420" r="8" fill="#0891b2" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="910" cy="420" r="3" fill="white"/>
    <!-- Bottom -->
    <circle cx="800" cy="530" r="8" fill="#1d4ed8" stroke="#60a5fa" stroke-width="1.5"/>
    <circle cx="800" cy="530" r="3" fill="white"/>
    <!-- Left -->
    <circle cx="690" cy="420" r="8" fill="#0891b2" stroke="#67e8f9" stroke-width="1.5"/>
    <circle cx="690" cy="420" r="3" fill="white"/>
    <!-- Diagonals -->
    <circle cx="878" cy="342" r="6" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
    <circle cx="878" cy="498" r="6" fill="#0e7490" stroke="#67e8f9" stroke-width="1"/>
    <circle cx="722" cy="342" r="6" fill="#1e40af" stroke="#60a5fa" stroke-width="1"/>
    <circle cx="722" cy="498" r="6" fill="#0e7490" stroke="#67e8f9" stroke-width="1"/>
  </g>

  <!-- Connections from center to outer nodes -->
  <g opacity="0.4" filter="url(#ai_soft)">
    <line x1="800" y1="382" x2="800" y2="318" stroke="#60a5fa" stroke-width="1"/>
    <line x1="838" y1="420" x2="902" y2="420" stroke="#67e8f9" stroke-width="1"/>
    <line x1="800" y1="458" x2="800" y2="522" stroke="#60a5fa" stroke-width="1"/>
    <line x1="762" y1="420" x2="698" y2="420" stroke="#67e8f9" stroke-width="1"/>
    <line x1="827" y1="393" x2="873" y2="347" stroke="#60a5fa" stroke-width="1"/>
    <line x1="827" y1="447" x2="873" y2="493" stroke="#67e8f9" stroke-width="1"/>
    <line x1="773" y1="393" x2="727" y2="347" stroke="#60a5fa" stroke-width="1"/>
    <line x1="773" y1="447" x2="727" y2="493" stroke="#67e8f9" stroke-width="1"/>
  </g>

  <!-- Outer ring node labels -->
  <g font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="rgba(148,163,184,0.65)">
    <text x="800" y="295" text-anchor="middle">Tahminleme</text>
    <text x="930" y="424" text-anchor="start">Optimizasyon</text>
    <text x="800" y="555" text-anchor="middle">Otomasyon</text>
    <text x="670" y="424" text-anchor="end">Analitik</text>
  </g>

  <!-- Feature pills on the right -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <rect x="1100" y="240" width="360" height="56" rx="12" fill="rgba(10,20,50,0.8)" stroke="rgba(59,130,246,0.25)" stroke-width="1"/>
    <circle cx="1125" cy="268" r="14" fill="rgba(29,78,216,0.25)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
    <text x="1125" y="272" font-size="12" fill="#60a5fa" text-anchor="middle">⚡</text>
    <text x="1148" y="264" font-size="12" font-weight="600" fill="rgba(224,242,254,0.9)">Akıllı Süreç Otomasyonu</text>
    <text x="1148" y="282" font-size="10" fill="rgba(148,163,184,0.6)">Kurallara dayalı otomatik iş akışları</text>

    <rect x="1100" y="316" width="360" height="56" rx="12" fill="rgba(10,20,50,0.8)" stroke="rgba(8,145,178,0.25)" stroke-width="1"/>
    <circle cx="1125" cy="344" r="14" fill="rgba(8,145,178,0.15)" stroke="rgba(8,145,178,0.4)" stroke-width="1"/>
    <text x="1125" y="348" font-size="12" fill="#67e8f9" text-anchor="middle">🔮</text>
    <text x="1148" y="340" font-size="12" font-weight="600" fill="rgba(224,242,254,0.9)">Tahmine Dayalı Analiz</text>
    <text x="1148" y="358" font-size="10" fill="rgba(148,163,184,0.6)">Operasyon trendlerini öngörün</text>

    <rect x="1100" y="392" width="360" height="56" rx="12" fill="rgba(10,20,50,0.8)" stroke="rgba(34,197,94,0.2)" stroke-width="1"/>
    <circle cx="1125" cy="420" r="14" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.3)" stroke-width="1"/>
    <text x="1125" y="424" font-size="12" fill="#4ade80" text-anchor="middle">✓</text>
    <text x="1148" y="416" font-size="12" font-weight="600" fill="rgba(224,242,254,0.9)">Anomali Tespiti</text>
    <text x="1148" y="434" font-size="10" fill="rgba(148,163,184,0.6)">Anormal durumlar için otomatik uyarı</text>

    <rect x="1100" y="468" width="360" height="56" rx="12" fill="rgba(10,20,50,0.8)" stroke="rgba(245,158,11,0.2)" stroke-width="1"/>
    <circle cx="1125" cy="496" r="14" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.3)" stroke-width="1"/>
    <text x="1125" y="500" font-size="12" fill="#fbbf24" text-anchor="middle">📊</text>
    <text x="1148" y="492" font-size="12" font-weight="600" fill="rgba(224,242,254,0.9)">KPI Optimizasyonu</text>
    <text x="1148" y="510" font-size="10" fill="rgba(148,163,184,0.6)">Hedef bazlı performans yönetimi</text>
  </g>

  <!-- Left side title -->
  <text x="120" y="340" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="rgba(96,165,250,0.8)" letter-spacing="2">YAPAY ZEKA DESTEKLİ</text>
  <text x="120" y="388" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="42" fill="rgba(224,242,254,0.95)" letter-spacing="-1">Akıllı</text>
  <text x="120" y="436" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="42" fill="#3b82f6" letter-spacing="-1">Operasyonlar</text>
  <text x="120" y="490" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="rgba(148,163,184,0.65)">Verilerden içgörü, içgörülerden</text>
  <text x="120" y="512" font-family="'Segoe UI',Arial,sans-serif" font-size="15" fill="rgba(148,163,184,0.65)">otomatik aksiyonlar.</text>

  <!-- Bottom fade -->
  <defs>
    <linearGradient id="ai_fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#030610" stop-opacity="0"/>
      <stop offset="100%" stop-color="#030610" stop-opacity="0.95"/>
    </linearGradient>
  </defs>
  <rect x="0" y="750" width="1600" height="150" fill="url(#ai_fade)"/>
</svg>
