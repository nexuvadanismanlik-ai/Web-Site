<svg viewBox="0 0 200 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgG" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="lineG" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <linearGradient id="textG" x1="52" y1="0" x2="200" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e0f2fe"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Icon background -->
  <rect width="44" height="44" rx="10" fill="url(#bgG)"/>
  <rect x="0.5" y="0.5" width="43" height="43" rx="9.5" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>

  <!-- N lines -->
  <line x1="12" y1="11" x2="12" y2="33" stroke="url(#lineG)" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow2)"/>
  <line x1="12" y1="11" x2="32" y2="33" stroke="url(#lineG)" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow2)"/>
  <line x1="32" y1="11" x2="32" y2="33" stroke="url(#lineG)" stroke-width="2" stroke-linecap="round" opacity="0.9" filter="url(#glow2)"/>

  <!-- Nodes -->
  <circle cx="12" cy="11" r="3.2" fill="#bfdbfe" filter="url(#glow2)"/>
  <circle cx="12" cy="11" r="1.8" fill="white"/>
  <circle cx="12" cy="33" r="3.2" fill="#bfdbfe" filter="url(#glow2)"/>
  <circle cx="12" cy="33" r="1.8" fill="white"/>
  <circle cx="32" cy="11" r="3.2" fill="#67e8f9" filter="url(#glow2)"/>
  <circle cx="32" cy="11" r="1.8" fill="white"/>
  <circle cx="32" cy="33" r="3.2" fill="#67e8f9" filter="url(#glow2)"/>
  <circle cx="32" cy="33" r="1.8" fill="white"/>

  <!-- NEXUVA wordmark -->
  <text x="54" y="29" font-family="'Segoe UI', 'Inter', Arial, sans-serif" font-weight="700" font-size="20" letter-spacing="1" fill="url(#textG)">NEXUVA</text>
</svg>
