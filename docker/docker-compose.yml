version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: nexuva_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: nexuva
      POSTGRES_PASSWORD: nexuva_secret
      POSTGRES_DB: nexuva_os
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U nexuva -d nexuva_os']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
