<svg viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cta_bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1e42"/>
      <stop offset="100%" stop-color="#040810"/>
    </radialGradient>
    <radialGradient id="cta_glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e40af" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#1e40af" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cta_glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0891b2" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#0891b2" stop-opacity="0"/>
    </radialGradient>
    <filter id="cta_glow">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#cta_bg)"/>
  <ellipse cx="800" cy="350" rx="700" ry="450" fill="url(#cta_glow1)"/>
  <ellipse cx="1400" cy="700" rx="400" ry="300" fill="url(#cta_glow2)"/>

  <!-- Decorative grid -->
  <g opacity="0.04" stroke="#3b82f6" stroke-width="0.8">
    <line x1="0" y1="200" x2="1600" y2="200"/><line x1="0" y1="400" x2="1600" y2="400"/>
    <line x1="0" y1="600" x2="1600" y2="600"/><line x1="0" y1="800" x2="1600" y2="800"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Floating background elements -->
  <circle cx="160" cy="200" r="60" fill="none" stroke="rgba(59,130,246,0.08)" stroke-width="1"/>
  <circle cx="1440" cy="180" r="80" fill="none" stroke="rgba(8,145,178,0.08)" stroke-width="1"/>
  <circle cx="100" cy="700" r="100" fill="none" stroke="rgba(59,130,246,0.06)" stroke-width="1"/>
  <circle cx="1500" cy="750" r="70" fill="none" stroke="rgba(8,145,178,0.06)" stroke-width="1"/>

  <!-- Central content -->
  <!-- Badge -->
  <rect x="640" y="180" width="320" height="32" rx="16" fill="rgba(29,78,216,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <circle cx="660" cy="196" r="5" fill="#22c55e"/>
  <text x="672" y="200" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.8)">Hemen başlamaya hazır</text>

  <!-- Main heading -->
  <text x="800" y="280" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="58" fill="rgba(224,242,254,0.97)" text-anchor="middle" letter-spacing="-2">Operasyonlarınızı</text>
  <text x="800" y="350" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="58" fill="#3b82f6" text-anchor="middle" letter-spacing="-2" filter="url(#cta_glow)">Dönüştürün</text>
  <text x="800" y="410" font-family="'Segoe UI',Arial,sans-serif" font-size="20" fill="rgba(148,163,184,0.6)" text-anchor="middle">Nexuva &amp; LogiOps ile dijital dönüşümünüzü başlatın.</text>

  <!-- CTA Buttons (visual) -->
  <rect x="570" y="450" width="240" height="54" rx="12" fill="#1d4ed8"/>
  <rect x="570" y="450" width="240" height="54" rx="12" fill="url(#cta_glow1)" opacity="0.5"/>
  <text x="690" y="482" font-family="'Segoe UI',Arial,sans-serif" font-weight="600" font-size="16" fill="white" text-anchor="middle">Demo Talep Et</text>

  <rect x="828" y="450" width="240" height="54" rx="12" fill="none" stroke="rgba(59,130,246,0.35)" stroke-width="1.5"/>
  <text x="948" y="482" font-family="'Segoe UI',Arial,sans-serif" font-weight="500" font-size="16" fill="rgba(224,242,254,0.8)" text-anchor="middle">LogiOps İncele</text>

  <!-- Social proof row -->
  <g font-family="'Segoe UI',Arial,sans-serif">
    <text x="800" y="550" font-size="13" fill="rgba(148,163,184,0.4)" text-anchor="middle">Güvenen firmalar:</text>
    <!-- Company placeholder badges -->
    <rect x="450" y="568" width="100" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="500" y="586" font-size="10" fill="rgba(148,163,184,0.5)" text-anchor="middle">Firma A</text>
    <rect x="568" y="568" width="100" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="618" y="586" font-size="10" fill="rgba(148,163,184,0.5)" text-anchor="middle">Firma B</text>
    <rect x="686" y="568" width="100" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="736" y="586" font-size="10" fill="rgba(148,163,184,0.5)" text-anchor="middle">Firma C</text>
    <rect x="804" y="568" width="100" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="854" y="586" font-size="10" fill="rgba(148,163,184,0.5)" text-anchor="middle">Firma D</text>
    <rect x="922" y="568" width="100" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="972" y="586" font-size="10" fill="rgba(148,163,184,0.5)" text-anchor="middle">Firma E</text>
    <rect x="1040" y="568" width="100" height="28" rx="6" fill="rgba(255,255,255,0.04)" stroke="rgba(255,255,255,0.08)" stroke-width="1"/>
    <text x="1090" y="586" font-size="10" fill="rgba(148,163,184,0.5)" text-anchor="middle">Firma F</text>
  </g>

  <!-- Stats row -->
  <g font-family="'Segoe UI',Arial,sans-serif" text-anchor="middle">
    <line x1="400" y1="630" x2="1200" y2="630" stroke="rgba(255,255,255,0.06)" stroke-width="1"/>
    <text x="520" y="668" font-weight="700" font-size="32" fill="#3b82f6">50+</text>
    <text x="520" y="692" font-size="11" fill="rgba(148,163,184,0.5)">Aktif Müşteri</text>
    <text x="800" y="668" font-weight="700" font-size="32" fill="#0891b2">10.000+</text>
    <text x="800" y="692" font-size="11" fill="rgba(148,163,184,0.5)">Operasyon</text>
    <text x="1080" y="668" font-weight="700" font-size="32" fill="#22c55e">98%</text>
    <text x="1080" y="692" font-size="11" fill="rgba(148,163,184,0.5)">Memnuniyet</text>
  </g>

  <!-- Nexuva branding bottom -->
  <text x="800" y="780" font-family="'Segoe UI',Arial,sans-serif" font-size="14" fill="rgba(148,163,184,0.35)" text-anchor="middle" letter-spacing="3">NEXUVA × LOGIOPS</text>

  <defs>
    <linearGradient id="cta_fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#040810" stop-opacity="0"/>
      <stop offset="100%" stop-color="#040810" stop-opacity="0.85"/>
    </linearGradient>
  </defs>
  <rect x="0" y="800" width="1600" height="100" fill="url(#cta_fade)"/>
</svg>
