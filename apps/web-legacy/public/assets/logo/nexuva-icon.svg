<svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0" y1="0" x2="44" y2="44" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#93c5fd"/>
      <stop offset="100%" stop-color="#67e8f9"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="nodeglow">
      <feGaussianBlur stdDeviation="1" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background rounded square -->
  <rect width="44" height="44" rx="10" fill="url(#bgGrad)"/>
  <!-- Subtle inner shine -->
  <rect width="44" height="44" rx="10" fill="url(#bgGrad)" opacity="0.4"/>
  <rect x="0.5" y="0.5" width="43" height="43" rx="9.5" stroke="rgba(255,255,255,0.15)" stroke-width="1" fill="none"/>

  <!-- N-shape from network nodes -->
  <!-- Lines first (behind nodes) -->
  <!-- Left vertical: top-left → bottom-left -->
  <line x1="12" y1="11" x2="12" y2="33" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Diagonal crossbar: top-left → bottom-right -->
  <line x1="12" y1="11" x2="32" y2="33" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>
  <!-- Right vertical: top-right → bottom-right -->
  <line x1="32" y1="11" x2="32" y2="33" stroke="url(#lineGrad)" stroke-width="2" stroke-linecap="round" filter="url(#glow)" opacity="0.9"/>

  <!-- Nodes -->
  <!-- Top-left -->
  <circle cx="12" cy="11" r="3.5" fill="#bfdbfe" filter="url(#nodeglow)"/>
  <circle cx="12" cy="11" r="2" fill="white"/>
  <!-- Bottom-left -->
  <circle cx="12" cy="33" r="3.5" fill="#bfdbfe" filter="url(#nodeglow)"/>
  <circle cx="12" cy="33" r="2" fill="white"/>
  <!-- Top-right -->
  <circle cx="32" cy="11" r="3.5" fill="#67e8f9" filter="url(#nodeglow)"/>
  <circle cx="32" cy="11" r="2" fill="white"/>
  <!-- Bottom-right -->
  <circle cx="32" cy="33" r="3.5" fill="#67e8f9" filter="url(#nodeglow)"/>
  <circle cx="32" cy="33" r="2" fill="white"/>
</svg>
