<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Nexuva</title>
    <!-- Locale routing used to live in middleware.ts; a static export has no
         server, so the root entry point detects the browser language and
         forwards to the prerendered /tr/ or /en/ page. -->
    <script>
      (function () {
        var supported = ['tr', 'en'];
        var fallback = 'tr';
        var pref = (navigator.language || fallback).slice(0, 2).toLowerCase();
        var locale = supported.indexOf(pref) !== -1 ? pref : fallback;
        window.location.replace('/' + locale + '/' + window.location.search + window.location.hash);
      })();
    </script>
    <noscript>
      <meta http-equiv="refresh" content="0; url=/tr/" />
    </noscript>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #fafbff;
        color: #0f111f;
        font-family: Inter, system-ui, -apple-system, sans-serif;
      }
      .wrap {
        display: flex;
        align-items: center;
        justify-content: center;
        height: 100%;
      }
      .spinner {
        width: 34px;
        height: 34px;
        border-radius: 50%;
        border: 3px solid rgba(99, 102, 241, 0.2);
        border-top-color: #6366f1;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="wrap"><div class="spinner"></div></div>
    <p style="text-align: center">
      <a href="/tr/">Türkçe</a> · <a href="/en/">English</a>
    </p>
  </body>
</html>
