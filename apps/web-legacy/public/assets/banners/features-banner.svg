<svg viewBox="0 0 1600 900" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="fb_bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0c1e40"/>
      <stop offset="100%" stop-color="#04080f"/>
    </radialGradient>
    <linearGradient id="fb_card1" x1="0" y1="0" x2="1" y2="1" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#0d2255"/>
      <stop offset="100%" stop-color="#071530"/>
    </linearGradient>
    <filter id="fb_glow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fb_card_shadow">
      <feDropShadow dx="0" dy="6" stdDeviation="18" flood-color="#1e40af" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#fb_bg)"/>

  <!-- Background orbs -->
  <ellipse cx="200" cy="450" rx="400" ry="350" fill="#1e3a8a" opacity="0.12"/>
  <ellipse cx="1400" cy="450" rx="400" ry="350" fill="#0891b2" opacity="0.1"/>
  <ellipse cx="800" cy="150" rx="500" ry="200" fill="#1d4ed8" opacity="0.08"/>

  <!-- Grid -->
  <g opacity="0.04" stroke="#60a5fa" stroke-width="0.8">
    <line x1="0" y1="150" x2="1600" y2="150"/><line x1="0" y1="300" x2="1600" y2="300"/>
    <line x1="0" y1="450" x2="1600" y2="450"/><line x1="0" y1="600" x2="1600" y2="600"/>
    <line x1="0" y1="750" x2="1600" y2="750"/>
    <line x1="200" y1="0" x2="200" y2="900"/><line x1="400" y1="0" x2="400" y2="900"/>
    <line x1="600" y1="0" x2="600" y2="900"/><line x1="800" y1="0" x2="800" y2="900"/>
    <line x1="1000" y1="0" x2="1000" y2="900"/><line x1="1200" y1="0" x2="1200" y2="900"/>
    <line x1="1400" y1="0" x2="1400" y2="900"/>
  </g>

  <!-- Central connection lines -->
  <g opacity="0.3" filter="url(#fb_glow)">
    <line x1="800" y1="450" x2="280" y2="240" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3"/>
    <line x1="800" y1="450" x2="1320" y2="240" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6 3"/>
    <line x1="800" y1="450" x2="280" y2="660" stroke="#0891b2" stroke-width="1.5" stroke-dasharray="6 3"/>
    <line x1="800" y1="450" x2="1320" y2="660" stroke="#3b82f6" stroke-width="1.5" stroke-dasharray="6 3"/>
  </g>

  <!-- Center hub -->
  <circle cx="800" cy="450" r="50" fill="rgba(29,78,216,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="1.5"/>
  <circle cx="800" cy="450" r="32" fill="rgba(29,78,216,0.2)" stroke="rgba(59,130,246,0.4)" stroke-width="1"/>
  <!-- Hub icon - center square grid -->
  <rect x="788" y="438" width="10" height="10" rx="2" fill="#3b82f6" opacity="0.9"/>
  <rect x="802" y="438" width="10" height="10" rx="2" fill="#0891b2" opacity="0.9"/>
  <rect x="788" y="452" width="10" height="10" rx="2" fill="#0891b2" opacity="0.9"/>
  <rect x="802" y="452" width="10" height="10" rx="2" fill="#3b82f6" opacity="0.9"/>
  <text x="800" y="498" font-family="'Segoe UI',Arial,sans-serif" font-size="11" font-weight="600" fill="rgba(148,163,184,0.7)" text-anchor="middle">LogiOps</text>

  <!-- Feature Card 1: Workflow -->
  <rect x="100" y="160" width="340" height="170" rx="16" fill="#071530" stroke="rgba(59,130,246,0.25)" stroke-width="1" filter="url(#fb_card_shadow)"/>
  <rect x="100" y="160" width="340" height="4" rx="2" fill="#2563eb"/>
  <rect x="120" y="185" width="36" height="36" rx="10" fill="rgba(37,99,235,0.2)" stroke="rgba(59,130,246,0.3)" stroke-width="1"/>
  <!-- Workflow icon -->
  <circle cx="130" cy="195" r="4" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="147" cy="203" r="4" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <circle cx="130" cy="211" r="4" fill="none" stroke="#60a5fa" stroke-width="1.5"/>
  <line x1="134" y1="195" x2="143" y2="199" stroke="#60a5fa" stroke-width="1"/>
  <line x1="134" y1="211" x2="143" y2="207" stroke="#60a5fa" stroke-width="1"/>
  <text x="165" y="207" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="rgba(224,242,254,0.95)">Workflow Builder</text>
  <text x="120" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Sürükle-bırak akış tasarımı</text>
  <text x="120" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Otomatik tetikleyiciler &amp; koşullar</text>
  <text x="120" y="281" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Çoklu onay katmanları</text>
  <rect x="120" y="295" width="80" height="22" rx="5" fill="rgba(37,99,235,0.15)" stroke="rgba(59,130,246,0.3)" stroke-width="0.8"/>
  <text x="160" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#60a5fa" text-anchor="middle">Otomatik</text>

  <!-- Feature Card 2: Evrak -->
  <rect x="1160" y="160" width="340" height="170" rx="16" fill="#071530" stroke="rgba(8,145,178,0.25)" stroke-width="1" filter="url(#fb_card_shadow)"/>
  <rect x="1160" y="160" width="340" height="4" rx="2" fill="#0891b2"/>
  <rect x="1180" y="185" width="36" height="36" rx="10" fill="rgba(8,145,178,0.15)" stroke="rgba(8,145,178,0.3)" stroke-width="1"/>
  <rect x="1188" y="193" width="18" height="20" rx="2" fill="none" stroke="#67e8f9" stroke-width="1.5"/>
  <line x1="1192" y1="199" x2="1202" y2="199" stroke="#67e8f9" stroke-width="1"/>
  <line x1="1192" y1="204" x2="1202" y2="204" stroke="#67e8f9" stroke-width="1"/>
  <line x1="1192" y1="209" x2="1198" y2="209" stroke="#67e8f9" stroke-width="1"/>
  <text x="1225" y="207" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="rgba(224,242,254,0.95)">Evrak Yönetimi</text>
  <text x="1180" y="245" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Dijital arşivleme &amp; erişim</text>
  <text x="1180" y="263" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Versiyon kontrolü</text>
  <text x="1180" y="281" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Hukuki uyumluluk desteği</text>
  <rect x="1180" y="295" width="80" height="22" rx="5" fill="rgba(8,145,178,0.12)" stroke="rgba(8,145,178,0.3)" stroke-width="0.8"/>
  <text x="1220" y="310" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#67e8f9" text-anchor="middle">Güvenli</text>

  <!-- Feature Card 3: Takım -->
  <rect x="100" y="570" width="340" height="170" rx="16" fill="#071530" stroke="rgba(34,197,94,0.2)" stroke-width="1" filter="url(#fb_card_shadow)"/>
  <rect x="100" y="570" width="340" height="4" rx="2" fill="#16a34a"/>
  <rect x="120" y="595" width="36" height="36" rx="10" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="1"/>
  <!-- Team icon -->
  <circle cx="132" cy="601" r="4" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <circle cx="142" cy="601" r="4" fill="none" stroke="#4ade80" stroke-width="1.5"/>
  <path d="M127 615 Q132 610 137 615 Q137 610 142 615 Q147 610 147 615" stroke="#4ade80" stroke-width="1.2" fill="none"/>
  <text x="165" y="617" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="rgba(224,242,254,0.95)">Ekip İş Birliği</text>
  <text x="120" y="655" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Rol bazlı yetkilendirme</text>
  <text x="120" y="673" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Gerçek zamanlı bildirimler</text>
  <text x="120" y="691" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Departman bazlı erişim</text>
  <rect x="120" y="705" width="80" height="22" rx="5" fill="rgba(34,197,94,0.1)" stroke="rgba(34,197,94,0.25)" stroke-width="0.8"/>
  <text x="160" y="720" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#4ade80" text-anchor="middle">Kurumsal</text>

  <!-- Feature Card 4: Otomasyon -->
  <rect x="1160" y="570" width="340" height="170" rx="16" fill="#071530" stroke="rgba(245,158,11,0.2)" stroke-width="1" filter="url(#fb_card_shadow)"/>
  <rect x="1160" y="570" width="340" height="4" rx="2" fill="#d97706"/>
  <rect x="1180" y="595" width="36" height="36" rx="10" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.25)" stroke-width="1"/>
  <!-- Automation cog icon -->
  <circle cx="1198" cy="613" r="6" fill="none" stroke="#fbbf24" stroke-width="1.5"/>
  <circle cx="1198" cy="613" r="2.5" fill="#fbbf24"/>
  <text x="1225" y="617" font-family="'Segoe UI',Arial,sans-serif" font-weight="700" font-size="14" fill="rgba(224,242,254,0.95)">İş Akışı Otomasyonu</text>
  <text x="1180" y="655" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Otomatik görev ataması</text>
  <text x="1180" y="673" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">Kural motoru &amp; koşullar</text>
  <text x="1180" y="691" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="rgba(148,163,184,0.65)">SLA takibi &amp; uyarılar</text>
  <rect x="1180" y="705" width="80" height="22" rx="5" fill="rgba(245,158,11,0.1)" stroke="rgba(245,158,11,0.25)" stroke-width="0.8"/>
  <text x="1220" y="720" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#fbbf24" text-anchor="middle">Akıllı</text>

  <!-- Bottom fade -->
  <defs>
    <linearGradient id="fb_fade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#04080f" stop-opacity="0"/>
      <stop offset="100%" stop-color="#04080f" stop-opacity="0.9"/>
    </linearGradient>
  </defs>
  <rect x="0" y="750" width="1600" height="150" fill="url(#fb_fade)"/>
</svg>
