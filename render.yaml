# Render Infrastructure-as-Code
# Deploy three services from this monorepo:
#   1. nexuva-api   — NestJS backend
#   2. nexuva-web   — Next.js public website
#   3. nexuva-admin — Next.js admin panel
#
# Required: set all envVars marked sync:false in the Render dashboard before first deploy.
#
# ─────────────────────────────────────────────────────────────────────────────
# THIS FILE IS NOT WHAT IS RUNNING.
#
# The live services were created by hand and carry different names:
#
#   nexuva-api    →  Web-Site-backend           (Node, Frankfurt)
#   nexuva-web    →  Nexuva-Web-Site-Frontend   (Static, Global)
#   nexuva-admin  →  nexuva-admin               (Node, Frankfurt)
#
# Render matches blueprint services by name, so nothing here applies to them:
# their build command, start command and every environment variable live only in
# the dashboard. Adding a variable to this file changes nothing in production —
# an hour was spent on exactly that misunderstanding.
#
# Keep this file as the definition of a correct deployment, and treat the
# dashboard as the source of truth for what is actually running, until the two
# are reconciled.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── Backend API (NestJS + Fastify) ─────────────────────────────────────────
  - type: web
    name: nexuva-api
    runtime: node
    plan: starter
    # --prod=false is required: NODE_ENV=production (which the runtime needs,
    # not least to keep Swagger off a public service) otherwise makes pnpm skip
    # devDependencies — and TypeScript, the Nest CLI and the Prisma CLI all live
    # there, so the build has no compilers.
    buildCommand: >
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @nexuva/shared run build &&
      pnpm --filter @nexuva/api run build
    startCommand: pnpm --filter @nexuva/api run start:prod
    autoDeploy: true
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Migrations cannot run through Supabase's transaction pooler — pgbouncer
      # will not execute DDL — so schema.prisma declares a directUrl and the
      # deploy needs a session-mode connection string (port 5432) as well as the
      # pooled one. Absent, `prisma migrate deploy` fails at startup, and while
      # the old start command chained it with && that meant the server never
      # started at all.
      - key: DIRECT_URL
        sync: false
      # Names the environment this process belongs to, so it refuses to run
      # against a database marked as a different one.
      - key: APP_ENV
        value: production
      # Lets the API check that a publish actually reached visitors.
      - key: SITE_URL
        sync: false
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d
      - key: CORS_ORIGINS
        sync: false
      - key: R2_ACCOUNT_ID
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_NAME
        value: nexuva-os
      - key: R2_PUBLIC_URL
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: EMAIL_FROM
        sync: false
      - key: EMAIL_FROM_NAME
        value: Nexuva OS
      - key: RESEND_API_KEY
        sync: false

  # ── Public Website (Next.js static export) ──────────────────────────────────
  # Served as static files: no Node runtime, no start command. Content is
  # fetched from nexuva-api during the build and baked into the HTML, so the
  # API must be deployed and reachable before this builds.
  # To move to a server deployment with ISR, see apps/web/MIGRATION.md.
  - type: web
    name: nexuva-web
    runtime: static
    # --prod=false for the same reason as the API: Next, TypeScript and Tailwind
    # are devDependencies and would be skipped if NODE_ENV is production.
    buildCommand: >
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @nexuva/shared run build &&
      pnpm --filter @nexuva/web run build
    staticPublishPath: apps/web/out
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: '20'
      - key: NEXT_PUBLIC_API_URL
        sync: false

  # ── Admin Panel (Next.js) ───────────────────────────────────────────────────
  - type: web
    name: nexuva-admin
    runtime: node
    plan: starter
    # --prod=false for the same reason as the other services.
    buildCommand: >
      pnpm install --frozen-lockfile --prod=false &&
      pnpm --filter @nexuva/shared run build &&
      pnpm --filter @nexuva/admin run build
    startCommand: pnpm --filter @nexuva/admin run start
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NEXT_PUBLIC_API_URL
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: NEXTAUTH_SECRET
        generateValue: true
